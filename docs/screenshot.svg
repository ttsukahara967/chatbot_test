<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif">
  <rect width="800" height="480" fill="#f5f6f8"/>

  <!-- header -->
  <rect x="0" y="0" width="800" height="42" fill="#ffffff"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#e2e4e8" stroke-width="1"/>
  <text x="24" y="26" font-size="15" font-weight="700" fill="#1a1a1a">AI Chatbot Sample</text>

  <!-- user bubble -->
  <rect x="516" y="58" width="260" height="34" rx="12" fill="#2563eb"/>
  <text x="646" y="80" font-size="13" fill="#ffffff" text-anchor="middle">有給休暇は何日ですか？</text>

  <!-- assistant bubble -->
  <rect x="24" y="106" width="560" height="188" rx="12" fill="#ffffff" stroke="#e2e4e8" stroke-width="1"/>
  <text x="40" y="130" font-size="12.5" fill="#1a1a1a">
    <tspan x="40" dy="0">日本の労働基準法では、従業員が請求できる年次有給休暇(年休)は以</tspan>
    <tspan x="40" dy="20">下のように定められています。ただし、中小企業については、大企業よ</tspan>
    <tspan x="40" dy="20">りも取得しやすい環境にあるとされています。</tspan>
    <tspan x="40" dy="20">・入社6ヶ月経過後から付与されるため、初年度には10日間の未消化分</tspan>
    <tspan x="40" dy="20">があります。</tspan>
    <tspan x="40" dy="20">・その後、1年間で2週間ごとに1日ずつ追加されます。例えば、4月から</tspan>
    <tspan x="40" dy="20">翌年3月末までの期間内で、途中退職しない限り最大40日の付与となり</tspan>
    <tspan x="40" dy="20">ます。</tspan>
  </text>

  <!-- input bar -->
  <line x1="0" y1="438" x2="800" y2="438" stroke="#e2e4e8" stroke-width="1"/>
  <rect x="24" y="454" width="704" height="26" rx="6" fill="#ffffff" stroke="#d0d3d9" stroke-width="1"/>
  <text x="36" y="471" font-size="12.5" fill="#8a8f98">Type a message...</text>
  <rect x="740" y="454" width="60" height="26" rx="6" fill="#2563eb"/>
  <text x="770" y="471" font-size="12" fill="#ffffff" text-anchor="middle">Send</text>
</svg>
